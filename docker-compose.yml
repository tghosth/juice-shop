services:
  juice-shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juice-shop
    networks:
      - juice-shop-network
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      # Distroless image has node but no shell or wget; use fetch for health probing.
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: juice-shop-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./www:/var/www:ro
    networks:
      - juice-shop-network
    depends_on:
      juice-shop:
        condition: service_healthy
    restart: unless-stopped

networks:
  juice-shop-network:
    driver: bridge